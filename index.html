<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 15 Años - Eloisa Simone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tipografías Elegantes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'gold-light': '#F9DF9F',
                        'gold-mid': '#D4AF37',
                        'gold-dark': '#998100',
                        'blush': '#FFF0F5',
                        'navy': '#2C3E50'
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-gold': 'pulse-gold 2s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        'pulse-gold': {
                            '0%, 100%': { opacity: 1, filter: 'brightness(1)' },
                            '50%': { opacity: .8, filter: 'brightness(1.2)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FEF9F9; /* Tono rosa súper sutil */
            font-family: 'Montserrat', sans-serif; /* Tipografía limpia para textos */
        }
        .font-elegant {
            font-family: 'Cormorant Garamond', serif; /* Tipografía para subtítulos */
        }
        .font-signature {
            font-family: 'Great Vibes', cursive; /* Tipografía de firma para el nombre */
        }
    </style>
</head>

                Eloisa Simone
            </h1>
            
            <h2 class="font-elegant text-2xl tracking-widest text-navy uppercase mt-2">Mis 15 Años</h2>
        </section>
