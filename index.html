<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis 15 Años - Eloisa Simone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tipografías Elegantes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'gold-light': '#F9DF9F',
                        'gold-mid': '#D4AF37',
                        'gold-dark': '#998100',
                        'blush': '#FFF0F5',
                        'navy': '#2C3E50'
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-gold': 'pulse-gold 2s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        'pulse-gold': {
                            '0%, 100%': { opacity: 1, filter: 'brightness(1)' },
                            '50%': { opacity: .8, filter: 'brightness(1.2)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FEF9F9; /* Tono rosa súper sutil */
            font-family: 'Montserrat', sans-serif; /* Tipografía limpia para textos */
        }
        .font-elegant {
            font-family: 'Cormorant Garamond', serif; /* Tipografía para subtítulos */
        }
        .font-signature {
            font-family: 'Great Vibes', cursive; /* Tipografía de firma para el nombre */
        }
    </style>
</head>
<body class="text-gray-800 antialiased overflow-x-hidden">

    <!-- Fondo decorativo -->
    <div class="fixed inset-0 z-0 pointer-events-none opacity-40">
        <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-rose-100 to-transparent"></div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="max-w-2xl mx-auto px-4 py-8 space-y-16 relative z-20">

        <!-- SECCIÓN PRINCIPAL (HERO) -->
        <section class="text-center pt-8 pb-4 relative">
            
            <!-- Corona de Imagen Real -->
            <div class="mb-4 inline-block relative">
                <img src="corona.png" alt="Corona" class="w-24 h-24 mx-auto object-contain filter drop-shadow-md animate-pulse-gold">
            </div>
            
            <p class="text-rose-500 tracking-[0.2em] text-xs font-semibold mb-4 uppercase">¡Estás invitado a celebrar!</p>
            
            <!-- Nombre con Tipografía Elegante -->
            <h1 class="font-signature text-6xl md:text-7xl text-transparent bg-clip-text bg-gradient-to-r from-gold-mid via-yellow-500 to-gold-dark mb-4 py-2">
                Eloisa Simone
            </h1>
            
            <h2 class="font-elegant text-2xl tracking-widest text-navy uppercase mt-2">Mis 15 Años</h2>
        </section>

        <!-- SECCIÓN DE LA FOTO CON MARIPOSAS -->
        <section class="relative max-w-sm mx-auto">
            
            <!-- Mariposa Flotante Arriba -->
            <div class="absolute -top-6 -right-8 animate-float z-30 w-24 h-24 pointer-events-none">
                <img src="mariposa.gif" alt="Mariposa" class="w-full h-full object-contain scale-[1.8] origin-top">
            </div>

            <!-- Contenedor de la Foto Principal (Borde dorado tipo arco) -->
            <div class="relative rounded-t-full rounded-b-3xl border-4 border-gold-mid/40 overflow-hidden shadow-2xl z-20 aspect-[3/4] bg-gray-100">
                <!-- AQUI VA TU FOTO DE FONDO -->
                <img src="https://images.unsplash.com/photo-1517457373958-b7bdd4587205?auto=format&fit=crop&w=600&q=80" alt="Eloisa Simone" class="w-full h-full object-cover">
            </div>

            <!-- Mariposa Flotante Abajo -->
            <div class="absolute -bottom-4 -left-8 animate-float z-30 w-24 h-24 pointer-events-none" style="animation-delay: 1.5s;">
                <img src="mariposa.gif" alt="Mariposa" class="w-full h-full object-contain scale-[1.8] origin-top">
            </div>
            
        </section>

        <!-- SECCIÓN DE DETALLES (FECHA Y LUGAR) -->
        <section class="space-y-8 bg-white/80 backdrop-blur-sm p-8 rounded-3xl border border-rose-100 shadow-lg text-center">
            
            <!-- Fecha -->
            <div>
                <h3 class="font-elegant text-3xl text-gold-dark mb-2">Cuándo</h3>
                <p class="text-lg font-light text-navy">Sábado, 26 de Diciembre de 2026</p>
                <p class="text-md text-gray-500">21:00 hrs</p>
            </div>

            <div class="w-16 h-px bg-gold-mid/30 mx-auto"></div>

            <!-- Lugar -->
            <div>
                <h3 class="font-elegant text-3xl text-gold-dark mb-2">Dónde</h3>
                <p class="text-lg font-light text-navy">Salón de Eventos Las Rosas</p>
                <p class="text-sm text-gray-500 mb-4">Av. Principal 1234, Ciudad</p>
                
                <a href="#" class="inline-block px-6 py-2 border border-gold-mid text-gold-dark rounded-full text-sm uppercase tracking-wider hover:bg-gold-mid hover:text-white transition-colors duration-300">
                    Ver Mapa
                </a>
            </div>

            <div class="w-16 h-px bg-gold-mid/30 mx-auto"></div>

            <!-- Código de Vestimenta -->
            <div>
                <h3 class="font-elegant text-2xl text-gold-dark mb-2">Dress Code</h3>
                <p class="text-md font-light text-navy uppercase tracking-widest">Elegante</p>
            </div>

        </section>

        <!-- SECCIÓN DE CONFIRMACIÓN -->
        <section class="text-center pb-12">
            <p class="font-elegant text-xl text-navy mb-6">Espero contar con tu presencia en esta noche tan especial.</p>
            <a href="https://wa.me/1234567890" target="_blank" class="inline-block bg-gradient-to-r from-gold-mid to-gold-dark text-white px-8 py-3 rounded-full text-sm uppercase tracking-widest shadow-lg hover:shadow-xl transform hover:-translate-y-1 transition-all duration-300">
                Confirmar Asistencia
            </a>
        </section>

    </main>
</body>
</html>
